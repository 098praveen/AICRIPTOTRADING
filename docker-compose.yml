version: '3.8'

services:
  bot:
    build: .
    container_name: crypto_bot
    restart: always
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - crypto_net

  db:
    image: postgres:15
    container_name: crypto_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: crypto_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d crypto_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - crypto_net

  redis:
    image: redis:7-alpine
    container_name: crypto_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - crypto_net

volumes:
  postgres_data:
  redis_data:

networks:
  crypto_net:
    driver: bridge
